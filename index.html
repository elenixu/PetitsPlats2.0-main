<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Les Petits Plats</title>

    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <img
        class="header-img"
        src="Assets/searchImg/header.jpg"
        alt="Header Image"
      />

      <div class="header-searchbar-title-container">
        <div class="header-title">
          CHERCHEZ PARMI PLUS DE 1500 RECETTES DU QUOTIDIEN, SIMPLES ET
          DÉLICIEUSES
        </div>

        <div class="searchBar-container">
          <div class="searchBar-search">
            <input
              type="text"
              class="searchBar-input"
              pattern="[^<>]*"
              title="Les balises &lt; et &gt; ne sont pas autorisées"
              placeholder="Rechercher une recette, un ingrédient, ..."
            />
            <div class="searchBar-button">
              <i class="fas fa-magnifying-glass" style="color: #ffffff"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="header-logo">
        <img src="Assets/searchImg/Logo.png" alt="Header logo" />
      </div>

      <div class="container-filterCounter">
        <div class="filters-container">
          <!-- Ingredients -->
          <div class="dropdown2">
            <div class="dropdown-btn2" id="dropdownButton2">
              <span class="dropdownText2" id="dropdownText2">Ingrédients</span>
              <i
                class="fa-solid fa-chevron-down dropdown-icon2"
                id="dropdownIcon2"
              ></i>
            </div>
            <div class="dropdown-list2" id="ingredient-filter"></div>
          </div>

          <!-- Appliances -->
          <div class="dropdown2">
            <div class="dropdown-btn2" id="dropdownButton4">
              <span class="dropdownText2" id="dropdownText4">Appareils</span>
              <i
                class="fa-solid fa-chevron-down dropdown-icon2"
                id="dropdownIcon4"
              ></i>
            </div>
            <div class="dropdown-list2" id="appliance-filter"></div>
          </div>

          <!-- Utensils -->
          <div class="dropdown2">
            <div class="dropdown-btn2" id="dropdownButton3">
              <span class="dropdownText2" id="dropdownText3">Ustensils</span>
              <i
                class="fa-solid fa-chevron-down dropdown-icon2"
                id="dropdownIcon3"
              ></i>
            </div>
            <div class="dropdown-list2" id="ustensil-filter"></div>
          </div>
        </div>

        <div class="counter"></div>
      </div>

      <div class="selected-filters" id="selected-filters"></div>

      <div class="cards-container" id="cards-root"></div>
    </header>

    <script src="recipes.js"></script>
    <script src="index.js" defer></script>
    <script src="searchBar.js" defer></script>
    <script src="filters.js" defer></script>
  </body>
</html>
